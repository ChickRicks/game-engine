site_name: Motor Gráfico em Rust
site_description: Trilha de estudos e documentação do desenvolvimento
site_author: ChickRicks
markdown_extensions:
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

site_url: https://ChickRicks.github.io/game-engine/

repo_url: https://github.com/ChickRicks/game-engine
repo_name: ChickRicks/game-engine
edit_uri: edit/main/docs/

theme:
  name: material
  language: pt-BR
  features:
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.expand
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Mudar para modo escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Mudar para modo claro

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Início: index.md
  - Fundamentos de Rust:
    - Introdução: 1-fundamentos-rust/0-index.md
    - Básicos de rust:
      - Index: 1-fundamentos-rust/1-basics/0-index.md
      - Prints e comentários: 1-fundamentos-rust/1-basics/1-Prints-e-comentarios.md
      - Variáveis e constantes: 1-fundamentos-rust/1-basics/2-Variaveis-e-constantes.md
      - Operadores: 1-fundamentos-rust/1-basics/3-Operadores.md
      - Condicionais: 1-fundamentos-rust/1-basics/4-Condicionais.md
      - Lastros de repetição: 1-fundamentos-rust/1-basics/5-Lastros-de-repeticao.md
      - Funções: 1-fundamentos-rust/1-basics/6-Funcoes.md
    - Ownership: 1-fundamentos-rust/2-ownership.md
    - Borrowing: 1-fundamentos-rust/3-borrowing.md
    - Lifetimes: 1-fundamentos-rust/4-lifetimes
    - traits: 1-fundamentos-rust/5-traits.md
    - Smart Pointers: 1-fundamentos-rust/6smart-pointers.md
  - Matemática para Gráficos:
    - Introdução: 2-matematica-graficos/index.md
    - Transformações Lineares: 2-matematica-graficos/transformacoes.md
    - Coordenadas Homogêneas: 2-matematica-graficos/coordenadas-homogeneas.md
    - Quaternions: 2-matematica-graficos/quaternions.md
  - Fundamentos de Computação Gráfica:
    - Introdução: 3-fundamentos-graficos/index.md
    - Pipeline Gráfico: 3-fundamentos-graficos/pipeline.md
  - GPU com wgpu:
    - Introdução: 4-gpu-wgpu/index.md
    - Primeiro Triângulo: 4-gpu-wgpu/primeiro-triangulo.md
    - Shaders WGSL: 4-gpu-wgpu/shaders-wgsl.md
    - Texturas e Materiais: 4-gpu-wgpu/texturas.md
  - Arquitetura de Motor:
    - Introdução: 5-arquitetura-motor/index.md
    - ECS em Rust: 5-arquitetura-motor/ecs.md
  - Subsistemas:
    - Introdução: 6-subsistemas/index.md
    - Entrada e Janelas: 6-subsistemas/entrada.md
    - Áudio: 6-subsistemas/audio.md
    - Física: 6-subsistemas/fisica.md