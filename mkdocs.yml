site_name: Motor Gráfico em Rust
site_description: Trilha de estudos e documentação do desenvolvimento
site_author: Seu Nome
markdown_extensions:
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

# Troque "seuusuario" e "seurepo" pelos valores reais do seu repositório
site_url: https://seuusuario.github.io/seurepo/

repo_url: https://github.com/seuusuario/seurepo
repo_name: seuusuario/seurepo
edit_uri: edit/main/docs/

theme:
  name: material
  language: pt-BR
  features:
    # navigation.tabs FOI REMOVIDO DE PROPÓSITO.
    # Com ele ativo, os itens de primeiro nível viram abas no topo e a barra
    # lateral só mostra os filhos da aba ativa. Sem ele, a árvore completa
    # fica visível na lateral.
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.expand
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Mudar para modo escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Mudar para modo claro

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

# NAVEGAÇÃO HIERÁRQUICA
# Cada seção é uma lista aninhada. O nome antes dos dois pontos é a categoria,
# e os itens abaixo são os arquivos dentro daquela pasta.
#
# REGRA: todo caminho listado aqui precisa existir em disco, senão o build falha.
# Enquanto um arquivo não existir, deixe a linha comentada com "#".
nav:
  - Início: index.md
  - Fundamentos de Rust:
    - Introdução: fundamentos-rust/index.md
    - Ownership e Borrowing: fundamentos-rust/ownership.md
    - Traits e Lifetimes: fundamentos-rust/traits.md
  - Matemática para Gráficos:
    - Introdução: matematica-graficos/index.md
    - Transformações Lineares: matematica-graficos/transformacoes.md
    - Coordenadas Homogêneas: matematica-graficos/coordenadas-homogeneas.md
    - Quaternions: matematica-graficos/quaternions.md
  - Fundamentos de Computação Gráfica:
    - Introdução: fundamentos-graficos/index.md
    - Pipeline Gráfico: fundamentos-graficos/pipeline.md
  - GPU com wgpu:
    - Introdução: gpu-wgpu/index.md
    - Primeiro Triângulo: gpu-wgpu/primeiro-triangulo.md
    - Shaders WGSL: gpu-wgpu/shaders-wgsl.md
    - Texturas e Materiais: gpu-wgpu/texturas.md
  - Arquitetura de Motor:
    - Introdução: arquitetura-motor/index.md
    - ECS em Rust: arquitetura-motor/ecs.md
  - Subsistemas:
    - Introdução: subsistemas/index.md
    - Entrada e Janelas: subsistemas/entrada.md
    - Áudio: subsistemas/audio.md
    - Física: subsistemas/fisica.md